  <text x="910" y="199" font-size="16" fill="#9a9a9a" text-anchor="end">⋯</text>
  <text x="910" y="249" font-size="16" fill="#9a9a9a" text-anchor="end">⋯</text>

  <!-- anotaciones -->
  <circle cx="220" cy="185" r="14" fill="#e0a526"/><text x="220" y="190" font-size="14" font-weight="700" fill="#111" text-anchor="middle">1</text>
  <text x="240" y="445" font-size="14" fill="#fff"><tspan font-weight="700" fill="#ffd27a">① Settings → Environment Variables.</tspan> Busca las que empiezan con CONTIFICO_</text>
  <text x="240" y="472" font-size="14" fill="#fff"><tspan font-weight="700" fill="#ffd27a">② ⋯ → Edit</tspan> en cada una, pega el valor nuevo, marca los 3 entornos y <tspan font-weight="700">Save</tspan>.</text>
  <text x="240" y="499" font-size="14" fill="#fff"><tspan font-weight="700" fill="#ffd27a">③ Deployments → ⋯ del último → Redeploy.</tspan> Sin este paso la app sigue con las llaves viejas.</text>
  <text x="240" y="532" font-size="12" fill="#9a9a9a">Ilustración: los valores reales nunca se muestran aquí ni se suben al repo.</text>
