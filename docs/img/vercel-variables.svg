  <!-- panel -->
  <text x="240" y="132" font-size="20" font-weight="700" fill="#fff">Environment Variables</text>
  <text x="240" y="154" font-size="12" fill="#9a9a9a">Production · Preview · Development</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    <rect x="240" y="172" width="690" height="44" rx="8" fill="#1d1a10" stroke="#e0a526"/>
    <text x="256" y="199" fill="#ffd27a">CONTIFICO_API_KEY</text><text x="560" y="199" fill="#777">••••••••••••••••</text>
    <rect x="240" y="222" width="690" height="44" rx="8" fill="#1d1a10" stroke="#e0a526"/>
    <text x="256" y="249" fill="#ffd27a">CONTIFICO_TOKEN</text><text x="560" y="249" fill="#777">••••••••••••••••</text>
    <rect x="240" y="272" width="690" height="44" rx="8" fill="#1a1a1a" stroke="#333"/>
    <text x="256" y="299" fill="#ddd">CONTIFICO_POS_ID</text><text x="560" y="299" fill="#777">••••••••••••••••</text>
    <rect x="240" y="322" width="690" height="44" rx="8" fill="#1a1a1a" stroke="#333"/>
    <text x="256" y="349" fill="#ddd">CONTIFICO_CUENTA_BANCARIA_TRA</text><text x="560" y="349" fill="#777">••••••••••••••••</text>
